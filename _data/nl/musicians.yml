- name: Sylvain Boisvert
  image: "img/sylvain.png"
  bio: |-
    Oorspronkelijk klassiek opgeleid, heeft Sylvain een zeer eclectische loopbaan gehad.\\
    Hij studeerde in Frankrijk aan het Conservatorium van Tarbes en het Conservatorium van Toulouse van 1987 tot 1999. Hij raakte al snel geïnteresseerd in uitgebreide technieken op de fluit (meerstemmige klanken, fluit en stem, percussieve klanken, enz.) en muzikale improvisatie.\\
    Hij bespeelt ook de C-fluit, altfluit, basfluit, piccolo en pifano (traditionele Braziliaanse bamboefluit).\\
    Altijd op zoek naar nieuwe ervaringen, diversifieerde hij zijn praktijk door te spelen in verschillende formaties naast Gnawa-muzikanten (Marokko), in een forró-groep en in een Son Jarocho-groep (traditionele Mexicaanse muziek uit Vera Cruz).\\
    Met het oog op een muziekpraktijk die voor iedereen toegankelijk is, geeft hij muziekles als privéleraar en ook bij een gespecialiseerde instelling voor kinderen (IRSA).

    Het was de ontmoeting met de wereld van de beroemde Hermeto Pascoal (Braziliaanse multi-instrumentalist en componist) die zijn passie voor Braziliaanse muziek deed ontstaan. Dit bracht hem ertoe vele malen naar Brazilië te reizen, waar hij de kans had om zich te vormen bij gerenommeerde muzikanten zoals Antonio Rocha, Eduardo Neves, Itiberê Zwarg...\\
    In 2016 richtte hij de Clube de Choro de Bruxelas op samen met de Braziliaanse bassist Everton Rodrigues, met als doel zijn passie te delen.
- name: Matteo Carola
  image: "img/matteo.png"
  bio: |-
    Met een Master in jazzgitaar (2013) werd Matteo opgeleid aan het Koninklijk Conservatorium van Brussel door Fabien Degryse en Victor Da Costa.\\
    Al gefascineerd door het gitaarspel en de magische stem van João Gilberto, ontdekte hij dankzij Victor Da Costa (Braziliaan) de samba's van Cartola en Nelson Cavaquinho, waarvan de ritmes en klanken (vooral het spel op de 7-snarige gitaar) hem onmiddellijk in hun ban sloegen. In de zomer van 2012 ontdekte hij een andere stijl van Braziliaanse muziek, Choro.\\
    Gegrepen door deze nieuwe stijl ondernam hij meerdere studiereizen naar Brazilië (2013, 2016 en 2019), waar hij het cavaquinho leerde spelen (een kleine 4-snarige gitaar typisch voor choro en samba) en de breedte en diepte van de wereld van de Braziliaanse gitaar ontdekte.\\
    Naast zijn activiteiten als professioneel muzikant (jazz, Braziliaanse muziek, Napolitaans lied) geeft hij ook les, zowel in openbare instellingen (academies) als in verenigingen (Clube do Choro de Bruxelas) en als privéleraar.
